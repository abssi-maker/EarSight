[project]
name = "earsight"
version = "0.1.0"
requires-python = ">=3.11"
description = "Automated audio description agent crew"
dependencies = [
    "google-genai>=0.8",
    "google-auth>=2.29",
    "google-cloud-aiplatform>=1.60",
    "confluent-kafka>=2.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "ffmpeg-python>=0.2",
    "Pillow>=10.3",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-cloud-storage>=2.17",
    "webvtt-py>=0.4",
]

[project.scripts]
earsight-pipeline = "scripts.pipeline:main"
earsight-validate = "scripts.validate_cues:main"
