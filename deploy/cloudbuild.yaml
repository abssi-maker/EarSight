steps:
  # ── Build & push all service images ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.orchestrator',
           '-t', 'gcr.io/$PROJECT_ID/earsight-orchestrator:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-orchestrator:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.transcriber',
           '-t', 'gcr.io/$PROJECT_ID/earsight-transcriber:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-transcriber:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.framer',
           '-t', 'gcr.io/$PROJECT_ID/earsight-framer:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-framer:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.describer',
           '-t', 'gcr.io/$PROJECT_ID/earsight-describer:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-describer:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.synthesiser',
           '-t', 'gcr.io/$PROJECT_ID/earsight-synthesiser:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-synthesiser:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.mixer',
           '-t', 'gcr.io/$PROJECT_ID/earsight-mixer:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-mixer:${_TAG}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.frontend',
           '--build-arg', 'NEXT_PUBLIC_ORCHESTRATOR_URL=${_ORCHESTRATOR_URL}',
           '-t', 'gcr.io/$PROJECT_ID/earsight-frontend:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/earsight-frontend:${_TAG}']

  # ── Deploy to Cloud Run ───────────────────────────────────────────────────────
  # All agent services use Vertex AI + ADC via the Cloud Run service account.
  # GOOGLE_CLOUD_PROJECT is injected as an env var (not a secret).
  # No GOOGLE_API_KEY in production — the service account credential is sufficient.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-orchestrator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-orchestrator:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - '^@^GOOGLE_CLOUD_PROJECT=$PROJECT_ID@GOOGLE_CLOUD_LOCATION=${_REGION}@FRONTEND_URL=https://earsight-frontend-xc3lx35vha-uc.a.run.app,https://earsight-frontend-131214399019.us-central1.run.app'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-transcriber'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-transcriber:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},GOOGLE_GENAI_USE_VERTEXAI=TRUE'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-framer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-framer:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-describer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-describer:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},GOOGLE_GENAI_USE_VERTEXAI=TRUE'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-synthesiser'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-synthesiser:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION}'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-mixer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-mixer:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '--set-secrets'
      - 'CONFLUENT_BOOTSTRAP_SERVERS=CONFLUENT_BOOTSTRAP_SERVERS:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest,GCS_BUCKET=GCS_BUCKET:latest'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'earsight-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/earsight-frontend:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'

substitutions:
  _REGION: us-central1
  # New Gemini models reach Vertex's global endpoint before regional ones.
  _VERTEX_LOCATION: 'global'
  _TAG: 'latest'
  _ORCHESTRATOR_URL: ''   # override at deploy time

options:
  logging: CLOUD_LOGGING_ONLY
